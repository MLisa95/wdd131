<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Practice</title>
    <meta name="author" content="Lisakhanya Gasa">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <main>
        <h1>Favorite Flowers</h1>
        <div class="flower-gallery">
            <img src="images/crocus.jpg" alt="Crocus Flower" loading="lazy">
            <img src="images/lily.jpg" alt="Lily Flower" loading="lazy">
            <img src="images/orchid.jpg" alt="Orchid Flower" loading="lazy">
            <img src="images/plumeria.jpg" alt="Plumeria Flower" loading="lazy">
            <img src="images/sunflower.jpg" alt="Sunflower Flower" loading="lazy">
            <img src="images/tulip.jpg" alt="Tulip Flower" loading="lazy">
        </div>
    </main>
