<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Lisakhanya Gasa">
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <h1>Product Review Form</h1>

    <form method="get" action="review.html" class="review-form">
        <fieldset>
            <legend>Product Name:</legend>
            <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
            <!-- JavaScript will add <option> elements here in array-->
            </select>
        </fieldset>

        <fieldset class="star-rating">
            <legend>Overall Rating:</legend>

            <input type="radio" id="star5" name="rating" value="5" required />
            <label for="star5" title="5 stars">★</label>

            <input type="radio" id="star4" name="rating" value="4" />
            <label for="star4" title="4 stars">★</label>

            <input type="radio" id="star3" name="rating" value="3" />
            <label for="star3" title="3 stars">★</label>

            <input type="radio" id="star2" name="rating" value="2" />
            <label for="star2" title="4 star2">★</label>

            <input type="radio" id="star1" name="rating" value="1" />
            <label for="star1" title="1 star">★</label>
        </fieldset>

        <fieldset>
            <legend>Date of Installation:</legend>
            <input type="date" id="dateInstalled" name="dateInstalled" required>
        </fieldset>

        <fieldset>
            <legend>Useful Features (check all that apply):</legend>

            <label>
                <input type="checkbox" id="feature1" name="features" value="Easy to use">
                Easy to use
            </label>

            <label>
                <input type="checkbox" id="feature2" name="features" value="Good quality">
                Good quality
            </label>

            <label>
                <input type="checkbox" id="feature3" name="features" value="Affordable">
                Affordable
            </label>

            <label>
                <input type="checkbox" id="feature4" name="features" value="Great support">
                Great support
            </label>
        </fieldset>

        <fieldset>
            <legend>Written Review (optional):</legend>
            <textarea id="review" name="review" rows="4" cols="30"></textarea>

            <legend for="username">User Name (optional):</legend>
            <input type="text" id="username" name="username" />

            <input type="submit" value="Submit Review" />
        </fieldset>

    </form>
    
    <script src="scripts/form.js"></script>
</body>
</html>
